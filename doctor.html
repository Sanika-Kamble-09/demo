<!DOCTYPE html>
<html>
<head>

<title>Doctors</title>
<link rel="stylesheet" href="style.css">

</head>

<body>

<h2 style="text-align:center">Doctor Management</h2>

<div class="form-container">

<input type="text" id="dname" placeholder="Doctor Name">

<input type="text" id="special" placeholder="Specialization">

<button onclick="addDoctor()">Add Doctor</button>

</div>

<table>

<tr>
<th>Name</th>
<th>Specialization</th>
</tr>

<tbody id="doctorList"></tbody>

</table>

<script>

function addDoctor(){

let name=document.getElementById("dname").value
let spec=document.getElementById("special").value

let doctors=JSON.parse(localStorage.getItem("doctors")) || []

doctors.push({name:name,spec:spec})

localStorage.setItem("doctors",JSON.stringify(doctors))

displayDoctors()

}

function displayDoctors(){

let doctors=JSON.parse(localStorage.getItem("doctors")) || []

let data=""

doctors.forEach(d=>{

data+=`
<tr>
<td>${d.name}</td>
<td>${d.spec}</td>
</tr>
`

})

document.getElementById("doctorList").innerHTML=data

}

displayDoctors()

</script>

</body>
</html>
